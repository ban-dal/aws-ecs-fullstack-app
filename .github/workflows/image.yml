# 앱 컨테이너 이미지를 빌드한다. PR에서는 빌드하고 컨테이너의 /api/health만 확인한다.
# main에서는 같은 이미지를 commit SHA 태그로 preprod·prod ECR 저장소에 각 환경의 image
# 역할로 올린다. 한 번 빌드한 이미지를 두 환경이 쓰므로, prod에는 preprod와 같은 커밋이
# 배포된다. ECS 호스트가 t4g(Arm)이므로 arm64 runner에서 빌드한다.
name: Build image

on:
  pull_request:
    branches: [main]
    paths:
      - apps/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .github/workflows/image.yml
  push:
    branches: [main]
    # workflow 변경만으로는 이미지를 올리지 않는다. 필요하면 main에서 수동 실행한다.
    paths:
      - apps/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
  workflow_dispatch:

permissions:
  contents: read

# shell을 지정해야 -eo pipefail로 실행되어 파이프 중간의 실패가 가려지지 않는다.
defaults:
  run:
    shell: bash

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      # 계정 ID는 secret이라 로그에서 가려진다.
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --platform linux/arm64 -f apps/web/Dockerfile -t "web:$IMAGE_TAG" .
      - name: Check /api/health in the container
        run: |
          docker run -d --name web -p 3000:3000 -e APP_ENV=ci "web:$IMAGE_TAG"
          for _ in $(seq 1 30); do
            if body="$(curl -fsS http://127.0.0.1:3000/api/health)"; then
              echo "$body"
              jq -e '.status == "ok"' <<<"$body" >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs web
          exit 1

      # 아래는 main에서만 실행된다. image 역할은 main 브랜치 토큰만 신뢰한다.
      # 역할 이름은 infra/modules/iam과 같아야 한다.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/aws-fullstack-lab-image
          aws-region: ${{ env.AWS_REGION }}
      # 저장소는 태그를 덮어쓸 수 없으므로(IMMUTABLE) 같은 태그가 이미 있으면 올리지 않는다.
      # 그래서 다시 실행해도 안전하다. push 스캔은 레지스트리 설정이 맡고 결과 개수만 요약에 남긴다.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        name: Push to preprod and prod
        run: |
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          for environment in preprod prod; do
            repository="aws-fullstack-lab-$environment-web"
            if aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
              echo "$repository:$IMAGE_TAG already exists; skipping push"
            else
              docker tag "web:$IMAGE_TAG" "$registry/$repository:$IMAGE_TAG"
              docker push "$registry/$repository:$IMAGE_TAG"
            fi
            digest="$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' --output text)"
            findings="scan pending"
            if aws ecr wait image-scan-complete --repository-name "$repository" --image-id "imageTag=$IMAGE_TAG" 2>/dev/null; then
              findings="$(aws ecr describe-image-scan-findings --repository-name "$repository" --image-id "imageTag=$IMAGE_TAG" \
                --query 'imageScanFindings.findingSeverityCounts' --output json \
                | jq -r 'to_entries | map("\(.key)=\(.value)") | join(" ") | if . == "" then "no findings" else . end')"
            fi
            {
              echo "### $environment"
              echo "- image: \`$repository:$IMAGE_TAG\`"
              echo "- digest: \`$digest\`"
              echo "- scan: $findings"
            } >> "$GITHUB_STEP_SUMMARY"
          done
