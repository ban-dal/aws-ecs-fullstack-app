# merge된 main에서만 한 환경의 루트(infra/environments/<environment>)를 적용한다.
# merge만으로는 배포되지 않는다. plan과 apply는 서로 다른 OIDC 역할과 GitHub 환경을 쓴다. plan 파일에는 민감한 값이
# 들어갈 수 있으므로 저장 plan은 runner 밖으로 내보내지 않는다.
#
# plan 작업은 변경 요약을 실행 화면에 올리고 변경 내용의 fingerprint를 넘긴다. apply
# 작업은 승인 뒤 plan을 다시 만들고, fingerprint가 승인 때와 같을 때만 적용한다. 그래서
# 승인한 plan과 적용되는 plan이 같다. 허용하는 변경의 기준은 scripts/tfplan.sh에 있다.
name: Apply service foundation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: AWS environment to apply after reviewing the plan
        required: true
        type: choice
        options: [preprod, prod]

permissions:
  contents: read

# shell을 지정해야 -eo pipefail로 실행되어 파이프 중간의 실패가 가려지지 않는다.
# 계정 ID와 state 버킷 이름은 공개 로그에 남지 않도록 secret으로 받는다. secret 값은
# job 시작부터 로그 전체에서 가려지므로 역할 ARN이나 backend 설정 안에 섞여도 드러나지 않는다.
defaults:
  run:
    shell: bash

concurrency:
  group: foundation-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TARGET_ENV: ${{ inputs.environment }}
      TF_VAR_expected_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - name: Check required configuration
        run: |
          test -n "$TF_VAR_expected_account_id"
          test -n "$TF_STATE_BUCKET"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN || format('arn:aws:iam::{0}:role/aws-fullstack-lab-plan', secrets.AWS_ACCOUNT_ID) }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Plan the selected state
        id: plan
        run: |
          terraform -chdir="infra/environments/$TARGET_ENV" init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TARGET_ENV/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform -chdir="infra/environments/$TARGET_ENV" plan -input=false -no-color -lock-timeout=5m \
            -out="$RUNNER_TEMP/foundation.tfplan"
          terraform -chdir="infra/environments/$TARGET_ENV" show -json "$RUNNER_TEMP/foundation.tfplan" > "$RUNNER_TEMP/foundation.json"
          {
            echo "## $TARGET_ENV plan"
            scripts/tfplan.sh summary "$RUNNER_TEMP/foundation.json"
          } >> "$GITHUB_STEP_SUMMARY"
          scripts/tfplan.sh check-foundation "$RUNNER_TEMP/foundation.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "fingerprint=$(scripts/tfplan.sh fingerprint "$RUNNER_TEMP/foundation.json")" >> "$GITHUB_OUTPUT"

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}-apply
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TARGET_ENV: ${{ inputs.environment }}
      TF_VAR_expected_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - name: Check required configuration
        run: |
          test -n "$TF_VAR_expected_account_id"
          test -n "$TF_STATE_BUCKET"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN || format('arn:aws:iam::{0}:role/aws-fullstack-lab-apply', secrets.AWS_ACCOUNT_ID) }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Plan again and compare with the approved plan
        env:
          APPROVED_FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
        run: |
          terraform -chdir="infra/environments/$TARGET_ENV" init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TARGET_ENV/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform -chdir="infra/environments/$TARGET_ENV" plan -input=false -no-color -lock-timeout=5m \
            -out="$RUNNER_TEMP/foundation.tfplan"
          terraform -chdir="infra/environments/$TARGET_ENV" show -json "$RUNNER_TEMP/foundation.tfplan" > "$RUNNER_TEMP/foundation.json"
          scripts/tfplan.sh check-foundation "$RUNNER_TEMP/foundation.json"
          fingerprint="$(scripts/tfplan.sh fingerprint "$RUNNER_TEMP/foundation.json")"
          if [ "$fingerprint" != "$APPROVED_FINGERPRINT" ]; then
            echo "승인 이후 plan이 바뀌었다. 적용하지 않는다. workflow를 다시 실행해 새 plan을 승인한다." >&2
            scripts/tfplan.sh summary "$RUNNER_TEMP/foundation.json" >&2
            exit 1
          fi
          echo "승인한 plan과 같다: $fingerprint"
      - name: Apply the approved plan
        run: terraform -chdir="infra/environments/$TARGET_ENV" apply -input=false -no-color "$RUNNER_TEMP/foundation.tfplan"
