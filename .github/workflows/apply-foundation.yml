name: Apply service foundation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: AWS environment to apply after reviewing the plan
        required: true
        type: choice
        options: [preprod, prod]

permissions:
  contents: read

concurrency:
  group: foundation-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}-plan
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TARGET_ENV: ${{ inputs.environment }}
      TF_VAR_expected_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - name: Check required configuration
        env:
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
        run: |
          test -n "$AWS_PLAN_ROLE_ARN"
          test -n "$AWS_ACCOUNT_ID"
          test -n "$TF_STATE_BUCKET"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
      - name: Plan the selected state
        run: |
          terraform -chdir=infra/plan init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TARGET_ENV/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform -chdir=infra/plan plan -input=false -no-color -lock-timeout=5m \
            -var="environment=$TARGET_ENV"

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}-apply
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TARGET_ENV: ${{ inputs.environment }}
      TF_VAR_expected_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - name: Check required configuration
        env:
          AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
        run: |
          test -n "$AWS_APPLY_ROLE_ARN"
          test -n "$AWS_ACCOUNT_ID"
          test -n "$TF_STATE_BUCKET"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
      - name: Create and inspect an apply plan
        run: |
          terraform -chdir=infra/plan init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TARGET_ENV/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform -chdir=infra/plan plan -input=false -lock-timeout=5m \
            -var="environment=$TARGET_ENV" -out="$RUNNER_TEMP/foundation.tfplan"
          terraform -chdir=infra/plan show -no-color "$RUNNER_TEMP/foundation.tfplan"
          terraform -chdir=infra/plan show -json "$RUNNER_TEMP/foundation.tfplan" > "$RUNNER_TEMP/foundation.json"
      - name: Allow only foundation creation
        run: |
          jq -e '
            all(.resource_changes[]?;
              (.address | startswith("module.service_foundation.")) and
              (.change.actions == ["create"] or .change.actions == ["no-op"])
            ) and
            ([.resource_changes[]? | select(.change.actions == ["create"])] | length <= 17)
          ' "$RUNNER_TEMP/foundation.json" >/dev/null
      - name: Apply the inspected plan
        run: terraform -chdir=infra/plan apply -input=false "$RUNNER_TEMP/foundation.tfplan"
