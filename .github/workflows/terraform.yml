name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - infra/**
      - scripts/**
      - .github/workflows/terraform.yml

permissions:
  contents: read

# AWS 자격 없이 정적 검사만 한다. plan과 apply는 운영자가 로컬에서 scripts/infra.sh로 한다.
# shell을 지정해야 -eo pipefail로 실행되어 파이프 중간의 실패가 가려지지 않는다.
defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.0'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - name: Validate environment roots
        run: |
          for root in infra/environments/*/; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
      - name: Check script syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          node --check infra/bootstrap/tests/*.test.mjs
          node --test scripts/tests/*.test.mjs
