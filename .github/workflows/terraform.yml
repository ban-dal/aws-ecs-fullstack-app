name: Terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# shell을 지정해야 -eo pipefail로 실행되어 파이프 중간의 실패가 가려지지 않는다.
defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.0'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/plan init -backend=false -input=false
      - run: terraform -chdir=infra/plan validate
      - name: Check script syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          node --check infra/bootstrap/policy-tests/*.test.mjs

  plan:
    # fork PR은 AWS 자격을 받지 않는다. 같은 저장소의 PR도 브랜치 코드가 plan 역할로
    # 실행되기 전에 *-plan 환경 승인을 기다린다.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.TF_STATE_BUCKET != '' &&
      vars.AWS_ACCOUNT_ID != ''
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [preprod, prod]
    environment: ${{ matrix.environment }}-plan
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TARGET_ENV: ${{ matrix.environment }}
      TF_IN_AUTOMATION: 'true'
      TF_VAR_expected_account_id: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - name: Check environment plan role
        env:
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
        run: test -n "$AWS_PLAN_ROLE_ARN"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize environment state
        run: >-
          terraform -chdir=infra/plan init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TARGET_ENV/terraform.tfstate"
          -backend-config="region=$AWS_REGION"
      - name: Plan environment
        run: |
          terraform -chdir=infra/plan plan -input=false -no-color -lock-timeout=5m \
            -var="environment=$TARGET_ENV" -out="$RUNNER_TEMP/plan.tfplan"
          terraform -chdir=infra/plan show -json "$RUNNER_TEMP/plan.tfplan" > "$RUNNER_TEMP/plan.json"
          summary="$RUNNER_TEMP/summary/$TARGET_ENV.md"
          mkdir -p "$(dirname "$summary")"
          {
            echo "### $TARGET_ENV"
            scripts/tfplan.sh summary "$RUNNER_TEMP/plan.json"
            echo
            scripts/tfplan.sh check-foundation "$RUNNER_TEMP/plan.json" || true
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
      # 요약에는 리소스 주소와 변경 종류만 있고 값은 없다.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-summary-${{ matrix.environment }}
          path: ${{ runner.temp }}/summary/${{ matrix.environment }}.md
          retention-days: 1
          if-no-files-found: ignore

  comment:
    # PR 코드를 checkout하지 않고 plan 작업이 남긴 요약만 읽어 댓글을 쓴다. 댓글 쓰기
    # 권한이 PR 브랜치 코드에 닿지 않게 하기 위해서다.
    needs: plan
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # 두 plan이 모두 요약 전에 실패하면 받을 artifact가 없다. 그래도 댓글은 갱신한다.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: plan-summary-*
          path: summary
          merge-multiple: true
      - name: Update the plan comment
        run: |
          marker='<!-- terraform-plan-summary -->'
          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[].filename' \
            | grep -E '^(infra/|scripts/|\.github/workflows/)' || true)"
          {
            echo "$marker"
            echo "## Terraform plan"
            echo "commit \`${HEAD_SHA:0:7}\` · [실행 기록]($RUN_URL)"
            echo
            echo "**바뀐 인프라 파일**"
            if [ -n "$files" ]; then sed 's/.*/- `&`/' <<<"$files"; else echo "- 없음"; fi
            if grep -q '^infra/bootstrap/' <<<"$files"; then
              echo
              echo "> bootstrap 변경은 아래 plan에 나오지 않는다. PR 본문의 \`scripts/bootstrap.sh plan\` 결과를 확인한다."
            fi
            for environment in preprod prod; do
              echo
              if [ -f "summary/$environment.md" ]; then cat "summary/$environment.md"; else echo "### $environment"; echo "요약 없음: plan이 실패했거나 실행되지 않았다."; fi
            done
          } > body.md
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --slurp \
            | jq -r --arg marker "$marker" '[.[][] | select(.body | startswith($marker)) | .id][0] // empty')"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null
          fi
