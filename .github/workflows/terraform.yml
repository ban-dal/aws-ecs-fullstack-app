name: Terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/plan init -backend=false -input=false
      - run: terraform -chdir=infra/plan validate

  plan:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.TF_STATE_BUCKET != '' &&
      vars.AWS_PLAN_ROLE_ARN != '' &&
      vars.AWS_ACCOUNT_ID != ''
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [preprod, prod]
    environment: ${{ matrix.environment }}-plan
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TARGET_ENV: ${{ matrix.environment }}
      TF_IN_AUTOMATION: 'true'
      TF_VAR_expected_account_id: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize environment state
        run: >-
          terraform -chdir=infra/plan init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TARGET_ENV/terraform.tfstate"
          -backend-config="region=$AWS_REGION"
      - name: Plan environment
        run: terraform -chdir=infra/plan plan -input=false -no-color -lock-timeout=5m -var="environment=$TARGET_ENV"
